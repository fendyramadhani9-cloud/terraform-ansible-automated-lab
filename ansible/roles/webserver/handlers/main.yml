---
# ==============================================================================
# Webserver Service Handlers (Amazon Linux 2023 / systemd)
# ==============================================================================

- name: Restart php-fpm
  ansible.builtin.service:
    name: "{{ php_fpm_service | default('php8.3-fpm') }}"
    state: restarted

- name: Restart nginx
  ansible.builtin.service:
    name: nginx
    state: restarted

- name: Restart KopDesWeb
  ansible.builtin.service:
    name: nginx
    state: restarted

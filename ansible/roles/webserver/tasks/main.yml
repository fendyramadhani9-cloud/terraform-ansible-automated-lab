---
# ==============================================================================
# Role: Webserver (PHP Runtime & KopDes Application on Ubuntu 24.04 LTS)
# Target OS: Ubuntu 24.04 LTS (systemd, apt, Nginx, PHP 8.3 FPM)
# ==============================================================================

- name: Set variabel webserver untuk Debian / Ubuntu 24.04 LTS
  ansible.builtin.set_fact:
    web_user: "www-data"
    web_group: "www-data"
    php_fpm_sock: "/run/php/php-fpm.sock"
    php_fpm_service: "php8.3-fpm"
  when: ansible_os_family == 'Debian'

- name: Set variabel webserver untuk RedHat / AL2023
  ansible.builtin.set_fact:
    web_user: "nginx"
    web_group: "nginx"
    php_fpm_sock: "/run/php-fpm/www.sock"
    php_fpm_service: "php-fpm"
  when: ansible_os_family == 'RedHat'

# 1. Instalasi Paket Webserver & Runtime PHP
- name: Pasang Nginx, runtime PHP 8.3, dan ekstensi yang dibutuhkan di Ubuntu 24.04 LTS
  ansible.builtin.apt:
    name:
      - nginx
      - php-fpm
      - php-cli
      - php-mysql
      - php-curl
      - php-mbstring
      - php-xml
      - php-zip
      - php-bcmath
    state: present
    update_cache: yes
  when: ansible_os_family == 'Debian'

- name: Pasang Nginx, runtime PHP, dan ekstensi yang dibutuhkan di RedHat / AL2023
  ansible.builtin.dnf:
    name:
      - nginx
      - php
      - php-cli
      - php-fpm
      - php-pdo
      - php-mysqlnd
      - php-json
      - php-curl
      - php-mbstring
      - php-xml
      - php-zip
      - php-bcmath
    state: present
  when: ansible_os_family == 'RedHat'

# 2. Direktori Kerja & Kepemilikan User Web
- name: Pastikan direktori aplikasi, socket, dan log KopDes tersedia
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ web_user }}"
    group: "{{ web_group }}"
    mode: '0755'
  loop:
    - "{{ app_dest_dir }}"
    - "/var/log/kopdes"
    - "/var/log/nginx"
    - "/run/php"

# 3. Konfigurasi Pool PHP-FPM
- name: Temukan file konfigurasi pool www.conf PHP-FPM di Debian/Ubuntu
  ansible.builtin.find:
    paths: /etc/php
    patterns: "www.conf"
    recurse: yes
  register: ubuntu_php_fpm_pools
  when: ansible_os_family == 'Debian'

- name: Konfigurasi user, group, dan unix socket PHP-FPM di Debian/Ubuntu
  ansible.builtin.lineinfile:
    path: "{{ ubuntu_php_fpm_pools.files[0].path }}"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  loop:
    - { regexp: '^user =', line: "user = {{ web_user }}" }
    - { regexp: '^group =', line: "group = {{ web_group }}" }
    - { regexp: '^listen =', line: "listen = {{ php_fpm_sock }}" }
    - { regexp: '^listen.owner =', line: "listen.owner = {{ web_user }}" }
    - { regexp: '^listen.group =', line: "listen.group = {{ web_group }}" }
    - { regexp: '^listen.mode =', line: "listen.mode = 0660" }
  when: ansible_os_family == 'Debian' and ubuntu_php_fpm_pools.matched > 0
  notify: Restart php-fpm

- name: Konfigurasi user, group, dan unix socket PHP-FPM di RedHat/AL2023
  ansible.builtin.lineinfile:
    path: /etc/php-fpm.d/www.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  loop:
    - { regexp: '^user =', line: "user = {{ web_user }}" }
    - { regexp: '^group =', line: "group = {{ web_group }}" }
    - { regexp: '^listen =', line: "listen = {{ php_fpm_sock }}" }
    - { regexp: '^listen.owner =', line: "listen.owner = {{ web_user }}" }
    - { regexp: '^listen.group =', line: "listen.group = {{ web_group }}" }
    - { regexp: '^listen.mode =', line: "listen.mode = 0660" }
  when: ansible_os_family == 'RedHat'
  notify: Restart php-fpm

# 4. Kloning Source Code & Injeksi Konfigurasi .env
- name: Periksa apakah source code KopDes sudah ada pada node target
  ansible.builtin.stat:
    path: "{{ app_dest_dir }}/public/index.php"
  register: kopdes_app_index

- name: Pastikan direktori source code KopDes tersedia dari repository Web
  ansible.builtin.git:
    repo: "{{ app_repo_url | default('https://github.com/fendyramadhani9-cloud/kopdes-landingPAGE.git') }}"
    dest: "{{ app_dest_dir }}"
    version: "{{ app_repo_branch | default('main') }}"
    force: false
  when: not kopdes_app_index.stat.exists

- name: Validasi ketersediaan file entry point aplikasi KopDes (/var/www/kopdes/public/index.php)
  ansible.builtin.stat:
    path: "{{ app_dest_dir }}/public/index.php"
  register: kopdes_entrypoint_check
  failed_when: not kopdes_entrypoint_check.stat.exists

- name: Pastikan kepemilikan source code aplikasi dimiliki oleh user web
  ansible.builtin.file:
    path: "{{ app_dest_dir }}"
    state: directory
    owner: "{{ web_user }}"
    group: "{{ web_group }}"
    recurse: yes

- name: Inject file konfigurasi .env sesuai identitas node
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dest_dir }}/.env"
    owner: "{{ web_user }}"
    group: "{{ web_group }}"
    mode: '0640'
  no_log: true
  notify:
    - Restart php-fpm
    - Restart nginx

# 5. Konfigurasi Virtual Host Nginx
- name: Pasang konfigurasi Virtual Host Nginx untuk Debian / Ubuntu (sites-available)
  ansible.builtin.template:
    src: kopdes_nginx.conf.j2
    dest: /etc/nginx/sites-available/kopdes.conf
    owner: root
    group: root
    mode: '0644'
  when: ansible_os_family == 'Debian'
  notify: Restart nginx

- name: Aktifkan Virtual Host KopDes via symlink di sites-enabled (Debian / Ubuntu)
  ansible.builtin.file:
    src: /etc/nginx/sites-available/kopdes.conf
    dest: /etc/nginx/sites-enabled/kopdes.conf
    state: link
    force: true
  when: ansible_os_family == 'Debian'
  notify: Restart nginx

- name: Pasang konfigurasi Virtual Host Nginx untuk RedHat / AL2023 (conf.d)
  ansible.builtin.template:
    src: kopdes_nginx.conf.j2
    dest: /etc/nginx/conf.d/kopdes.conf
    owner: root
    group: root
    mode: '0644'
  when: ansible_os_family == 'RedHat'
  notify: Restart nginx

- name: Nonaktifkan default virtual host Nginx bawaan (Debian / Ubuntu)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/sites-enabled/default
    - /etc/nginx/sites-available/default
    - /etc/nginx/conf.d/default.conf
    - /etc/nginx/conf.d/kopdes.conf
  when: ansible_os_family == 'Debian'
  notify: Restart nginx

- name: Nonaktifkan default virtual host Nginx bawaan (RedHat / AL2023)
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  when: ansible_os_family == 'RedHat'
  notify: Restart nginx

- name: Uji validasi sintaks konfigurasi Nginx (nginx -t)
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

# 6. Menerapkan Konfigurasi & Memastikan Layanan Aktif
- name: Terapkan seluruh handler konfigurasi layanan sebelum health check (flush handlers)
  ansible.builtin.meta: flush_handlers

- name: Pastikan layanan PHP-FPM aktif dan berjalan dengan konfigurasi terbaru
  ansible.builtin.service:
    name: "{{ php_fpm_service }}"
    state: restarted
    enabled: true

- name: Pastikan layanan Nginx aktif dan berjalan dengan konfigurasi terbaru
  ansible.builtin.service:
    name: nginx
    state: restarted
    enabled: true

# 7. Verifikasi Respon HTTP Lokal Node Web
- name: "Verifikasi respon HTTP lokal node web (Health Check: http://127.0.0.1/index.php?page=login)"
  ansible.builtin.uri:
    url: "http://127.0.0.1/index.php?page=login"
    method: GET
    status_code: 200
  register: local_health_check
  retries: 10
  delay: 3
  until: local_health_check.status is defined and local_health_check.status == 200

- name: "Verifikasi respon root URL node web (HTTP 200 atau 302 Redirect ke Login)"
  ansible.builtin.uri:
    url: "http://127.0.0.1/"
    method: GET
    status_code: [200, 302]
    follow_redirects: none
  register: root_health_check
  retries: 5
  delay: 2
  until: root_health_check.status is defined and (root_health_check.status == 200 or root_health_check.status == 302)

---
# ==============================================================================
# Role: Webserver (PHP Runtime & KopDes Application on Amazon Linux 2023)
# Target OS: Amazon Linux 2023 (systemd, dnf, Nginx, PHP 8.2+ FPM)
# ==============================================================================

- name: Pasang Nginx, runtime PHP, dan ekstensi yang dibutuhkan di Amazon Linux 2023
  ansible.builtin.dnf:
    name:
      - nginx
      - php
      - php-cli
      - php-fpm
      - php-pdo
      - php-mysqlnd
      - php-json
      - php-curl
      - php-mbstring
      - php-xml
      - php-zip
      - php-bcmath
    state: present

- name: Pastikan direktori aplikasi dan log KopDes tersedia dengan kepemilikan nginx
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: nginx
    group: nginx
    mode: '0755'
  loop:
    - "{{ app_dest_dir }}"
    - "/var/log/kopdes"
    - "/var/log/nginx"
    - "/run/php-fpm"

- name: Konfigurasi user dan group PHP-FPM pool agar sesuai dengan Nginx (nginx:nginx)
  ansible.builtin.lineinfile:
    path: /etc/php-fpm.d/www.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  loop:
    - { regexp: '^user =', line: 'user = nginx' }
    - { regexp: '^group =', line: 'group = nginx' }
    - { regexp: '^listen =', line: 'listen = /run/php-fpm/www.sock' }
    - { regexp: '^listen.owner =', line: 'listen.owner = nginx' }
    - { regexp: '^listen.group =', line: 'listen.group = nginx' }
    - { regexp: '^listen.mode =', line: 'listen.mode = 0660' }
  notify: Restart php-fpm

- name: Pastikan direktori source code KopDes tersedia dari repository Web
  ansible.builtin.git:
    repo: "{{ app_repo_url | default('https://github.com/fendyramadhani9-cloud/kopdes-iac-automationAWS.git') }}"
    dest: "{{ app_dest_dir }}"
    version: "{{ app_repo_branch | default('main') }}"
    force: false
  when: not (app_dest_dir ~ '/public/index.php') is file

- name: Pastikan kepemilikan source code aplikasi dimiliki oleh user nginx
  ansible.builtin.file:
    path: "{{ app_dest_dir }}"
    state: directory
    owner: nginx
    group: nginx
    recurse: yes

- name: Inject file konfigurasi .env sesuai identitas node ({{ server_node_name | default(ansible_hostname | default('WEB-ASG')) }})
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dest_dir }}/.env"
    owner: nginx
    group: nginx
    mode: '0640'
  notify:
    - Restart php-fpm
    - Restart nginx

- name: Pasang konfigurasi Virtual Host Nginx untuk KopDes Merah Putih
  ansible.builtin.template:
    src: kopdes_nginx.conf.j2
    dest: /etc/nginx/conf.d/kopdes.conf
    mode: '0644'
  notify: Restart nginx

- name: Nonaktifkan default virtual host Nginx jika ada
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  notify: Restart nginx

- name: Pastikan layanan PHP-FPM aktif dan berjalan saat booting (systemd)
  ansible.builtin.service:
    name: php-fpm
    state: started
    enabled: true

- name: Pastikan layanan Nginx aktif dan berjalan saat booting (systemd)
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Inisialisasi skema dan seed data database ke Amazon RDS secara idempotent
  ansible.builtin.command:
    cmd: "php {{ app_dest_dir }}/database/init.php"
  register: db_init_output
  changed_when: "'selesai dengan sukses' in db_init_output.stdout or 'Berhasil' in db_init_output.stdout"
  failed_when: false

- name: "Verifikasi respon HTTP lokal node web (Health Check: http://127.0.0.1/)"
  ansible.builtin.uri:
    url: "http://127.0.0.1/index.php?page=login"
    method: GET
    status_code: 200
  register: local_health_check
  retries: 3
  delay: 2
  until: local_health_check.status is defined and local_health_check.status == 200
  ignore_errors: true

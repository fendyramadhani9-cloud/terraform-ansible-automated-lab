# ==============================================================================
# ANSIBLE INVENTORY: KOPDES AWS NATIVE ARCHITECTURE (AMAZON EC2 / ASG)
# ==============================================================================
# Di AWS, instance EC2 web server berada di private subnet di belakang ALB.
# Anda dapat mengisi IP private / public / Bastion IP instance di bawah ini,
# atau menggunakan skrip dinamis `generate_inventory_aws.sh` / plugin `aws_ec2.yml`.

[webservers]
# Contoh entri jika diakses langsung atau via AWS Systems Manager / Bastion:
# web01 ansible_host=10.0.10.15 server_node_name=WEB-01
# web02 ansible_host=10.0.11.82 server_node_name=WEB-02

[webservers:vars]
ansible_user=ec2-user
ansible_ssh_private_key_file=~/.ssh/kopdes-key.pem
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
ansible_python_interpreter=/usr/bin/python3
ansible_become=yes
ansible_become_method=sudo

# ==============================================================================
# Ansible AWS EC2 Dynamic Inventory Plugin Configuration
# Menggunakan plugin: amazon.aws.aws_ec2
# Penggunaan: ansible-inventory -i ansible/aws_ec2.yml --graph
# ==============================================================================
plugin: amazon.aws.aws_ec2
regions:
  - us-east-1

filters:
  tag:Project:
    - kopdes
    - kopdes-merah-putih
  tag:Role: webserver
  instance-state-name: running

keyed_groups:
  - key: tags.Role
    prefix: role
  - key: tags.Environment
    prefix: env

groups:
  webservers: "tags.Role | default('') == 'webserver' or 'web' in tags.Name | default('')"

compose:
  ansible_host: private_ip_address
  server_node_name: tags.Name

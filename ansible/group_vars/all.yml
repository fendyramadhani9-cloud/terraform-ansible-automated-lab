# ==============================================================================
# ANSIBLE GLOBAL VARIABLES: KOPDES AWS NATIVE AUTOMATION
# Target Environment: Ubuntu 24.04 LTS & Amazon RDS MySQL
# ==============================================================================

# Application & Identity
app_name: "KopDes Merah Putih"
app_dest_dir: "/var/www/kopdes"
app_user: "www-data"
app_group: "www-data"
app_env: "production"
app_debug: false

# Database Layer (Amazon RDS MySQL)
# Nilai default dasar (ditimpa secara otomatis oleh extra-vars saat bootstrap/deployment)
db_host: "127.0.0.1"
db_port: 3306
db_name: "kopdes"
db_user: "kopdes_admin"
db_password: ""

# Entry Point (Application Load Balancer)
alb_dns_name: ""
server_node_name: "WEB-ASG"

# Amazon Simple Notification Service (SNS) - 100% AWS Academy Ready
aws_region: "us-east-1"
sns_topic_arn: ""
sns_recipient_email: "admin@kopdes.id"


# System & Timezone
timezone: "Asia/Jakarta"
